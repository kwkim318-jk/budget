/* Layout: one narrow phone column. 통장 흐름 (date by date) first, then inputs, then the monthly split drawn as soil strata and the 12-month flow. */
:root{
  /* 색 인덱스 — 항목: 수입 --inc 초록 · 필수 지출 --ess 모래 · 대출 상환 --debt 슬레이트(--debt2/--debt3 농담) · 여가비 --fun 라벤더 · 저축·투자 --sv 틸 · 일회성 --one 회색 · 총 지출 --ink
     상태(여기만 사용): 여유 --surplus 초록 · 관리 --sand 모래 · 부족 --warn 주황.  --c1~c12 = 세부 항목 구분용 */
  --c1:#B5824A; --c2:#A35E3E; --c3:#23704F; --c4:#4F7396; --c5:#8C6BA8; --c6:#C9A13B; --c7:#5E8C7A; --c8:#9A8C80; --c9:#C2577A; --c10:#3E8FA3; --c11:#7A8B3A; --c12:#6B6FB8;
  --d1:#E08A1E; --sky:#66B8E8; --d2:#8A4FBF; --d3:#2F6FB8; --fun:#8270A8; --inc:#4F8A68; --sv:#4E8F8C; --ess:#B08D57; --debt:#5A7394; --one:#8E9094; --debt2:color-mix(in srgb,var(--debt) 72%,var(--surface)); --debt3:color-mix(in srgb,var(--debt) 48%,var(--surface)); --leftover:#CFE6D9; --surplus:#3F8F63; --short:#D23B2A;
  --bg:#F9FAF3; --surface:#FFFFFF; --ink:#202316; --muted:#686D5A; --line:#D9DBD2;
  --accent:#586F4C; --accent-soft:#E1E5DF;
  --sand:#D8B475; --clay:#A35E3E; --silt:#8C9A86; --rock:#6E7FA0; --keep:#23704F;
  --warn:#B4541F; --warn-soft:#F6E3D7; --ok-soft:#E1E5DF; --in:#23704F;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

  --c1:#D4A36B; --c2:#D0866A; --c3:#5FC293; --c4:#7FA6CC; --c5:#B394D0; --c6:#E0BE5E; --c7:#86B3A1; --c8:#B8ABA0; --c9:#E07D9E; --c10:#6DBCCF; --c11:#A8B964; --c12:#9A9EE0;
  --d1:#F2A64A; --sky:#7DC6EF; --d2:#B48AE6; --d3:#6FA3E8; --fun:#B3A4D6; --inc:#7DB894; --sv:#7FBDB9; --ess:#D1B07A; --debt:#8FA6C4; --one:#9EA1A5; --debt2:color-mix(in srgb,var(--debt) 72%,var(--surface)); --debt3:color-mix(in srgb,var(--debt) 48%,var(--surface)); --leftover:#2A4A3A; --surplus:#78BD94; --short:#F07A66;
  --bg:#141416; --surface:#1E1E20; --ink:#E8E8EA; --muted:#9C9C9F; --line:#323235;
  --accent:#A3BC92; --accent-soft:#393E37;

  --warn:#EE9767; --warn-soft:#3B2519; --ok-soft:#393E37; --in:#5FC293; color-scheme:dark}}

  --c1:#D4A36B; --c2:#D0866A; --c3:#5FC293; --c4:#7FA6CC; --c5:#B394D0; --c6:#E0BE5E; --c7:#86B3A1; --c8:#B8ABA0; --c9:#E07D9E; --c10:#6DBCCF; --c11:#A8B964; --c12:#9A9EE0;
  --d1:#F2A64A; --sky:#7DC6EF; --d2:#B48AE6; --d3:#6FA3E8; --fun:#B3A4D6; --inc:#7DB894; --sv:#7FBDB9; --ess:#D1B07A; --debt:#8FA6C4; --one:#9EA1A5; --debt2:color-mix(in srgb,var(--debt) 72%,var(--surface)); --debt3:color-mix(in srgb,var(--debt) 48%,var(--surface)); --leftover:#2A4A3A; --surplus:#78BD94; --short:#F07A66;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}

.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

h1{font-size:20px;margin:0;font-weight:700}
.save{font-size:12px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px}

.row{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .name{flex:1 1 140px;min-width:0;font-size:14px}
.row .meta{flex:1 0 100%;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fields{display:flex;gap:6px;flex-wrap:wrap;flex:1 0 100%}
.fld{display:flex;flex-direction:column;gap:2px;flex:1 1 92px;min-width:0}
.fld > span{font-size:11px;color:var(--muted)}
#bankbox .fields > .fld:only-child{flex:0 1 calc(50% - 3px)}
#bankbox > .row{flex-wrap:nowrap;align-items:center;gap:8px}#bankbox > .row > .tname{flex:1 1 0!important;min-width:0;width:auto}#bankbox > .row > .money.solo{flex:0 0 132px}
#bankbox .cathead .tname{flex:1 1 0;min-width:0}.atitle{flex:1 1 0;min-width:0;display:flex}.atitle select{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:0;padding:4px 2px;width:auto;max-width:100%;cursor:pointer}

.money.atype{flex:0 0 auto;margin-left:auto;padding:0 6px;border-radius:6px}.money.atype select{font-size:12px;padding:3px 0;width:auto}
.money{display:flex;align-items:center;border:1px solid var(--cardline);border-radius:8px;padding:2px 8px;background:var(--bg);min-width:0}
.money span{color:var(--muted);font-size:13px}
.money input,.money select{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--f-num);font-size:14px;text-align:right;padding:5px 0}
.money select{font-family:var(--f-body);text-align:left;cursor:pointer}
.money input[type="date"]{text-align:left;font-size:13px}
.money input:focus,.money select:focus{outline:none}
.money:focus-within{border-color:var(--accent)}
.money.solo{flex:0 0 132px}
.tname{flex:1 1 140px;min-width:0;border:1px solid transparent;border-radius:8px;padding:5px 6px;margin-left:-6px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500}
.tname:hover{border-color:var(--cardline)}
.tname:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.del{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--warn);background:var(--warn-soft)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 0;background:none;border:0;border-top:1px dashed var(--line);color:var(--accent);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.card > .add:first-child{border-top:0}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--muted)}

.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--sand)}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--cardline);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip-tag{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-left:2px}
.chip[aria-pressed="true"] .chip-tag{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{background:var(--surface);border-radius:18px;border:1px solid var(--cardline);position:relative;overflow:visible;--capS:9px;--capR:18px}.hcap{position:sticky;top:var(--capTop,-999px);z-index:3;height:calc(var(--capS) + var(--capR));margin:calc(-1px - var(--capS)) -1px calc(1px - var(--capR));pointer-events:none}.hcap::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--capS) + var(--capR));background:var(--bg)}.hcap::after{content:"";position:absolute;left:0;right:0;top:var(--capS);height:calc(var(--capR) + 1px);border:1px solid var(--cardline);border-bottom:0;border-radius:var(--capR) var(--capR) 0 0;background:var(--surface);box-shadow:0 0 0 0 transparent}.hcapbg{}.hsc{padding:19px;display:flex;flex-direction:column;gap:14px;overflow:visible;scrollbar-width:none}.hsc::-webkit-scrollbar{display:none;width:0;height:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted)}
.big{font-size:38px;font-weight:600;line-height:1.1;margin-top:4px}
.sub{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.tight{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--accent)}
.pill.mid{background:color-mix(in srgb,var(--sand) 30%,var(--surface));color:color-mix(in srgb,var(--sand) 60%,var(--ink))}
.strata{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.strata span{display:block;min-width:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.lg{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.lg .t{font-size:13px;flex:1;min-width:0}
.lg .v{font-size:13px;text-align:right}
.lg .p{font-size:11px;color:var(--muted);display:block}
.stats{display:grid;grid-template-columns:1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px;text-align:right}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:15px;font-weight:600}
.hatch-sand{background:var(--sand)}
.hatch-clay{background:repeating-linear-gradient(135deg,var(--clay) 0 4px,color-mix(in srgb,var(--clay) 75%,var(--surface)) 4px 6px)}
.hatch-rock{background:repeating-linear-gradient(45deg,var(--rock) 0 3px,color-mix(in srgb,var(--rock) 70%,var(--surface)) 3px 5px)}
.hatch-silt{background:repeating-linear-gradient(0deg,var(--silt) 0 3px,color-mix(in srgb,var(--silt) 70%,var(--surface)) 3px 4px)}
.hatch-keep{background:var(--keep)}
.chart{background:var(--surface);border-radius:14px;border:1px solid var(--cardline);padding:12px 12px 6px;overflow:hidden}.chs{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}@supports (-moz-appearance:none){.chs,.flowlist{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 30%,transparent) transparent}}.chs::-webkit-scrollbar-button,.flowlist::-webkit-scrollbar-button{display:none;width:0;height:0}.chs::-webkit-scrollbar,.flowlist::-webkit-scrollbar{width:5px;height:5px}.chs::-webkit-scrollbar-track,.flowlist::-webkit-scrollbar-track{background:transparent}.chs::-webkit-scrollbar-track{margin:0 4px}.flowlist::-webkit-scrollbar-track{margin:10px 0}.chs::-webkit-scrollbar-thumb,.flowlist::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:99px}.chs::-webkit-scrollbar-thumb:hover,.flowlist::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
.chart svg{display:block;max-width:none}
.chart text{font-family:var(--f-num);fill:var(--muted)}
.chart .cv{font-size:11px}
.chart .cm{font-family:var(--f-body);font-size:12px}
.chart .hit{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin:0}
.reset{background:none;border:1px solid var(--cardline);color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
/* sticky dashboard */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.dash{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;border:0;box-shadow:inset 0 0 0 1px var(--cardline);transition:box-shadow .25s ease}
.tile .k{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:clamp(17px,5.4vw,24px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.bad .v{color:var(--warn)}
#m_save .v,#t_save .v{color:color-mix(in srgb,var(--ess) 78%,var(--ink))}#m_cum .v{color:var(--debt)}#t_allow:not(.bad) .v{color:var(--surplus)}#m_debt .v,#t_debt .v{color:var(--fun)}

.updrow[hidden]{display:none!important}.ucancel{background:color-mix(in srgb,var(--muted) 18%,var(--surface));color:var(--muted);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}

.subhead{font-size:11px;letter-spacing:.04em;color:var(--muted);padding-top:12px;font-weight:700}
.subtog{flex:0 0 auto;background:none;border:0;color:var(--accent);font:inherit;font-size:12px;font-weight:500;cursor:pointer;padding:2px 0}
.subs{flex:1 0 100%;margin-left:6px;padding-left:12px;border-left:2px solid var(--line)}

  ev.sort((a,b)=>a.d-b.d||(b.amt>0)-(a.amt>0));
  let bal=num(S.bank); ev.forEach(e=>{bal+=e.amt;e.bal=bal});
  return {ev,items,cardEss};
}
const leftAt=(it,date)=>{let l=it.start;for(const s of it.steps){if(s.d<=date)l=s.left;else break}return l};

function compute(){
  const R=simulate();
  const essTotal=S.ess.reduce((a,e)=>a+catM(e),0);
  const rows=MONTHS.map(M=>{
    const inM=R.ev.filter(e=>ymKey(e.d)===M.key);
    const sum=c=>inM.filter(e=>e.cat===c).reduce((a,e)=>a+e.amt,0);
    const inc=sum("pay")+sum("in"), ess=-sum("ess"), debt=-sum("debt"), one=-sum("oneoff");
    const emergV=allocAt(M.key,["emerg"]),goalV=allocAt(M.key,["goal","custom"]),funV=allocAt(M.key,["fun"]);
    const allow=inc-ess-debt-one-emergV-goalV;
    const end=new Date(M.y,M.m+1,0);
    const left=R.items.reduce((a,it)=>a+Math.max(0,leftAt(it,end)),0);
    const leftBy={cards:0,plans:0,loans:0};R.items.forEach(it=>{leftBy[it.kind]+=Math.max(0,leftAt(it,end))});
    const pays=inM.filter(e=>e.cat==="pay"&&e.src===0).length;
    const incBy={};inM.filter(e=>e.cat==="pay"||e.cat==="in").forEach(e=>{const n=String(e.label).replace(/ \(날짜.*\)$/,"");incBy[n]=(incBy[n]||0)+e.amt});
    const essBy={},essSub={};const addSub=(c,n,v)=>{const o=(essSub[c]=essSub[c]||{});o[n]=(o[n]||0)+v};inM.filter(e=>e.cat==="ess").forEach(e=>{if(e.esubs)Object.entries(e.esubs).forEach(([k,v])=>{const [c,n]=k.split("\u0001");addSub(c,n,v)});else if(e.ecat)addSub(e.ecat,e.esub||e.ecat,-e.amt);if(e.ecats)Object.entries(e.ecats).forEach(([c,v])=>essBy[c]=(essBy[c]||0)+v);else if(e.ecat)essBy[e.ecat]=(essBy[e.ecat]||0)-e.amt});
    const dk=k=>-inM.filter(e=>e.cat==="debt"&&e.kind===k).reduce((a,e)=>a+e.amt,0);const debtIt={};inM.filter(e=>e.cat==="debt").forEach(e=>{const o=(debtIt[e.kind]=debtIt[e.kind]||{}),n=e.dname||e.label||"기타";o[n]=(o[n]||0)-e.amt});
    return {M,inc,ess,debt,one,allow,emergV,goalV,funV,saveV:Math.max(0,allow-funV),bal:allow-funV,left,leftBy,pays,end,essBy,essSub,debtIt,incBy,debtBy:{cards:dk("cards"),plans:dk("plans"),loans:dk("loans")}};
  });
  // bank at each month end if each month's 용돈 is fully spent
  const balAt=d=>{let b=num(S.bank);for(const e of R.ev){if(e.d<=d)b=e.bal;else break}return b};
  let spent=0; rows.forEach(r=>{spent+=r.allow;r.cash=balAt(r.end)-spent;r.bankEnd=balAt(r.end)});
  const debtNow=[...S.loans,...S.cards,...S.plans].reduce((a,x)=>a+num(x.bal),0);
  const free=rows.findIndex(r=>r.left<1);
  return {R,rows,essTotal,debtNow,free};
}

const pctShares=(a,total)=>{const ps=(a.subs||[]).filter(x=>x.mode==="pct"),sp=ps.reduce((t,x)=>t+Math.max(0,num(x.p)),0),rem=Math.max(0,num(total)-fixedOf(a)),m=new Map();ps.forEach(x=>m.set(x,Math.round((sp>0?rem*Math.max(0,num(x.p))/sp:rem/ps.length)*100)/100));return m};
const pctFix=a=>{if(!hasPct(a))return;if(a.total==null)a.total=Math.round(allocV(a));pctShares(a,a.total).forEach((v,x)=>{x.v=v;x.freq="mo"})};
const funOvAt=(a,k)=>{const o=S.funOv&&S.funOv[k];if(o==null||!a||a.type!=="fun")return null;return (S.alloc||[]).find(q=>q.type==="fun"&&activeAt(q,k))===a?num(o):null};

requestAnimationFrame(()=>requestAnimationFrame(()=>{const root=(id&&document.getElementById(id))||sec;const fresh=[];root.querySelectorAll(SEL).forEach(e=>{const k=e.className+"::"+sig(e);const n=before.get(k)||0;if(n>0)before.set(k,n-1);else fresh.push(e)});const top=fresh.filter(e=>!fresh.some(o=>o!==e&&o.contains(e)));top.slice(0,3).forEach(e=>{e.classList.remove("gl-new");void e.offsetWidth;e.classList.add("gl-new");setTimeout(()=>e.classList.remove("gl-new"),300)});}))},true);
document.addEventListener("change",ev=>{const t=ev.target;if(!t.closest||!t.closest("#grpBody"))return;const id=t.dataset.list+"|"+t.dataset.i+"|"+t.dataset.f;requestAnimationFrame(()=>{const n=(t.isConnected?t:document.querySelector(`#grpBody [data-list="${t.dataset.list}"][data-i="${t.dataset.i}"][data-f="${t.dataset.f}"]`));if(!n)return;const w=n.closest(".money")||n;w.classList.remove("gl-saved");void w.offsetWidth;w.classList.add("gl-saved");setTimeout(()=>w.classList.remove("gl-saved"),950)})},true);
})();
</script>
<script>
(()=>{const NS="http://www.w3.org/2000/svg";let q=0;const fix=()=>{q=0;document.querySelectorAll(".chart text.cm").forEach(t=>{if(t.querySelector(".ten"))return;const s=t.textContent,m=/1(?=\d월)/.exec(s);if(!m)return;t.textContent="";t.append(document.createTextNode(s.slice(0,m.index)));const sp=document.createElementNS(NS,"tspan");sp.setAttribute("class","ten");sp.textContent=m[0];t.append(sp,document.createTextNode(s.slice(m.index+1)))})};
new MutationObserver(()=>{if(!q)q=requestAnimationFrame(fix)}).observe(document.body,{childList:true,subtree:true});fix()})();
</script>
<script>
(()=>{const $i=id=>document.getElementById(id);const md2=d=>(d.getMonth()+1)+"/"+d.getDate();
  const sh=document.createElement("div");sh.id="pnSheet";sh.hidden=true;sh.innerHTML=`<div class="pn-bg" data-pn="x"></div><div class="pn-in" role="dialog" aria-modal="true"><div class="pn-t" id="pnT"></div><div class="pn-s" id="pnS"></div><label class="pn-f"><span>날짜</span><input type="date" id="pnDate" required></label><label class="pn-c" id="pnShiftRow"><input type="checkbox" id="pnShift"><span>이후 일정도 변경</span></label><div class="pn-b"><button type="button" data-pn="x">취소</button><button type="button" class="pri" data-pn="ok" id="pnOk">반영</button></div><button type="button" class="pn-x" data-pn="del" id="pnDel" hidden></button></div>`;document.body.appendChild(sh);
  let M=null;const close=()=>{sh.hidden=true;M=null};
  window.__pnOpen=k=>{const info=window.__pnInfo&&window.__pnInfo(k);if(!info){window.__payNow(k);return}M={mode:"pay",k};$i("pnT").textContent=info.name||"";$i("pnS").textContent=info.d?"예정 "+md2(info.d):"";$i("pnDate").value=iso(T0);$i("pnDate").max=iso(T0);$i("pnShift").checked=false;$i("pnShiftRow").hidden=!info.rec;$i("pnOk").textContent="반영";$i("pnDel").hidden=true;sh.hidden=false};
  const openLog=id=>{const e=(S.log||[]).find(x=>x.id===id);if(!e)return;M={mode:"log",id};$i("pnT").textContent=e.label||"";$i("pnS").textContent=(e.card?"카드 ":"")+(e.amt>0?"+":"")+fmt(e.amt||0)+(e.src==="now"?" · 지금 반영":" · 지난 내역 반영");$i("pnDate").value=e.d;$i("pnDate").max="";$i("pnShiftRow").hidden=true;$i("pnOk").textContent="저장";const dl=$i("pnDel");dl.hidden=false;dl.textContent=e.src==="now"&&e.rev?"반영 취소":"기록 삭제";sh.hidden=false};
  sh.addEventListener("click",ev=>{const b=ev.target.closest("[data-pn]");if(!b||!M)return;const a=b.dataset.pn;if(a==="x"){close();return}
    if(a==="ok"){const v=$i("pnDate").value,P=pd(v);if(!P)return;const m=M;close();if(m.mode==="pay")window.__payNow(m.k,P,$i("pnShift").checked);else window.__logEdit(m.id,{d:v});return}
    if(a==="del"){const m=M;const e=(S.log||[]).find(x=>x.id===m.id);close();if(!e)return;if(e.src==="now"&&e.rev)window.__logCancel(m.id);else window.__logEdit(m.id,null)}});
  // 반영 기록 (Cash Flow 탭)
  let box=null;const row=e=>{const d=pd(e.d);return `<button type="button" class="lg-r" data-lid="${esc(e.id)}"><span class="lg-d">${d?md2(d):""}</span><span class="lg-l">${esc(e.label||"")}</span><span class="lg-a ${e.card?"card":e.amt>0?"pos":""}">${e.card?"카드 ":""}${e.amt>0?"+":""}${fmt(e.amt||0)}</span></button>`};
  const draw=()=>{const fb=document.querySelector(".flowbox");if(!fb)return;if(!box){box=document.createElement("div");box.id="logbox";fb.parentNode.insertBefore(box,fb);box.addEventListener("click",ev=>{const r=ev.target.closest(".lg-r");if(r)openLog(r.dataset.lid)})}
    const L=(S.log||[]).slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);if(!L.length){box.hidden=true;box.innerHTML="";return}box.hidden=false;const cur=ymS(T0);const by={};L.forEach(e=>{const k=(e.d||"").slice(0,7);(by[k]=by[k]||[]).push(e)});const ks=Object.keys(by).sort().reverse();const open=new Set([...box.querySelectorAll("details[open]")].map(d=>d.dataset.k));
    box.innerHTML=`<div class="lg-h"><span>반영 기록</span><span>${L.length}건</span></div>`+ks.map(k=>k===cur?by[k].map(row).join(""):`<details data-k="${k}" ${open.has(k)?"open":""}><summary>${+k.slice(2,4)}년 ${+k.slice(5,7)}월 · ${by[k].length}건</summary>${by[k].map(row).join("")}</details>`).join("")};
  const _r=render;render=function(){const x=_r.apply(this,arguments);try{draw()}catch(e){console.warn(e)}return x};try{draw()}catch(_){}
})();
</script>
